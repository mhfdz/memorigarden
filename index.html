<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06142d">
  <title>Untuk Kamu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--night:#06142d;--navy:#0b2447;--blue:#5fb6ff;--flower:#8fd3ff;--glow:#c9f2ff;--text:#fff;--muted:#c9dfff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--night);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden}button,input{font:inherit}button{touch-action:manipulation}#stars{position:fixed;inset:0;z-index:-3;width:100%;height:100%}.moon{position:fixed;right:9%;top:9%;width:76px;height:76px;border-radius:50%;background:#f5f8ff;box-shadow:0 0 35px #c9f2ff99,0 0 100px #5fb6ff55;z-index:-2;transition:transform .4s,box-shadow .4s}.moon:hover{transform:scale(1.08);box-shadow:0 0 45px #c9f2ff,0 0 120px #5fb6ff88}.page{min-height:100svh;padding:92px max(24px,calc((100% - 410px)/2 + 24px));display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;animation:sceneIn .55s ease both}.page.active{display:flex}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:10px;color:var(--flower);margin:0}h1,h2{font:600 clamp(40px,11vw,55px)/1 'Cormorant Garamond',serif;letter-spacing:-.03em;margin:12px 0}em{color:var(--glow);font-weight:500}.desc{font-size:13px;line-height:1.7;color:var(--muted);max-width:290px}.btn{border:1px solid #c9f2ff77;background:#eaf9ff;color:var(--night);border-radius:50px;padding:14px 22px;margin-top:23px;font:600 12px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 0 25px #5fb6ff55;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 5px 30px #5fb6ff88}.field{position:absolute;z-index:-1;bottom:0;width:120%;height:30%;opacity:.85;background:radial-gradient(ellipse at 5% 100%,#8fd3ff 0 5%,transparent 6%),radial-gradient(ellipse at 23% 100%,#4d9dcd 0 8%,transparent 9%),radial-gradient(ellipse at 47% 100%,#8fd3ff 0 5%,transparent 6%),radial-gradient(ellipse at 70% 100%,#4d9dcd 0 7%,transparent 8%),radial-gradient(ellipse at 94% 100%,#8fd3ff 0 5%,transparent 6%);background-size:75px 65px}.letter{max-width:365px;background:#f5fbff;color:#0b3152;text-align:left;padding:32px 26px;box-shadow:0 20px 45px #0007;position:relative}.letter:before,.letter:after{content:'✿';position:absolute;color:#5fb6ff;font-size:25px}.letter:before{top:10px;right:15px}.letter:after{bottom:9px;left:15px}.letter p{font:21px/1.8 'Cormorant Garamond',serif;white-space:pre-line}.gallery{width:min(100%,380px);display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}.photo{margin:0;padding:8px 8px 13px;background:#f7fcff;color:#0b3152;box-shadow:0 12px 25px #0005;transform:rotate(var(--r));cursor:pointer;transition:transform .25s,box-shadow .25s}.photo:nth-child(3){grid-column:span 2;width:75%;justify-self:center}.photo:hover{transform:rotate(0) translateY(-7px) scale(1.03);box-shadow:0 17px 30px #0008}.photo img,
.photo video{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#bddcf0}.photo figcaption{font:600 15px 'Cormorant Garamond',serif;margin-top:8px}.photo small{display:block;font-size:9px;color:#527492;margin-top:2px}.memories{width:100%;max-width:350px;text-align:left;margin-top:18px}.memory{display:flex;gap:15px;padding:0 0 29px}.memory i{font:27px 'Cormorant Garamond',serif;color:var(--flower);font-style:normal}.memory small{font-size:9px;color:var(--flower);letter-spacing:.13em}.memory h3{font:23px 'Cormorant Garamond',serif;margin:4px 0}.memory p{font-size:11px;line-height:1.6;color:var(--muted);margin:0}.reason{width:260px;height:260px;border:0;border-radius:50%;background:radial-gradient(circle,#e5fbff 0 7%,#65b9eb 8% 11%,transparent 12%),radial-gradient(ellipse at 50% 0,#77caff 0 22%,transparent 23%),radial-gradient(ellipse at 100% 50%,#77caff 0 22%,transparent 23%),radial-gradient(ellipse at 50% 100%,#77caff 0 22%,transparent 23%),radial-gradient(ellipse at 0 50%,#77caff 0 22%,transparent 23%),#0c315d;color:#f5fbff;padding:55px 37px 0;font:600 19px/1.3 'Cormorant Garamond',serif;cursor:pointer;box-shadow:0 0 35px #5fb6ff88;transition:transform .2s}.reason:hover{transform:scale(1.03)}.final{background:radial-gradient(circle at 50% 55%,#2c7eb266,transparent 45%)}.petal{position:fixed;color:var(--flower);font:25px serif;z-index:20;pointer-events:none;animation:fly 3s linear forwards}@keyframes fly{to{transform:translate(var(--x),-600px) rotate(480deg);opacity:0}}@keyframes sceneIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.page-nav{display:flex;gap:10px;margin-top:28px}.nav-btn{border:1px solid #c9f2ff77;border-radius:50px;padding:11px 16px;background:#0b2447;color:#c9f2ff;cursor:pointer;font-size:12px}.nav-btn.next{background:#eaf9ff;color:#06142d}#password-screen{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:26px;background:radial-gradient(circle at 50% 50%,#0b315d88,transparent 45%),#06142de8;transition:opacity .8s,visibility .8s}.password-card{width:min(100%,360px);padding:36px 30px;border:1px solid #ffffff26;border-radius:28px;text-align:center;background:#ffffff12;backdrop-filter:blur(18px);box-shadow:0 25px 65px #0008}.lock-flower{font-size:38px;margin:0}.password-card h2{font-size:35px;margin:9px 0}.password-card p{font-size:13px;line-height:1.6;color:var(--muted)}.password-card label{display:block;text-align:left;font-size:10px;letter-spacing:.12em;color:var(--flower);margin:22px 0 8px}#password-input{width:100%;padding:14px 16px;border:1px solid #c9f2ff55;border-radius:50px;outline:none;background:#fff;color:#06142d;text-align:center;font-size:15px}#unlock-btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:50px;background:var(--flower);color:#06142d;font-weight:600;cursor:pointer;transition:transform .2s}#unlock-btn:hover{transform:translateY(-2px)}#password-error{min-height:18px;margin:12px 0 0;color:#ffb2bf;font-size:12px}.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}#music-toggle{position:fixed;right:18px;bottom:18px;z-index:15;width:48px;height:48px;border:1px solid #c9f2ff66;border-radius:50%;background:#0b2447dd;color:var(--glow);font-size:19px;cursor:pointer;box-shadow:0 0 20px #5fb6ff55;display:none}#music-toggle.playing{display:block;animation:pulse 2s infinite}@keyframes pulse{50%{box-shadow:0 0 30px #8fd3ff}}#lightbox{position:fixed;z-index:40;inset:0;display:none;place-items:center;padding:25px;background:#021025e8}.lightbox-card{width:min(100%,520px);position:relative}.lightbox-card img{width:100%;max-height:75svh;object-fit:contain;display:block;border:7px solid #f7fcff}.lightbox-card p{margin:12px 0 0;text-align:center;color:var(--muted)}#lightbox-close{position:absolute;right:-10px;top:-12px;width:35px;height:35px;border:0;border-radius:50%;background:#f7fcff;color:#06142d;font-size:20px;cursor:pointer}@media(min-width:600px){.page{max-width:430px;margin:auto}}
  </style>
</head>
<body>
  <canvas id="stars"></canvas><div class="moon" title="A little moon magic"></div>
  <section id="password-screen" aria-label="Password screen"><div class="password-card"><p class="lock-flower">✿</p><p class="eyebrow">A little secret garden</p><h2>Before entering…</h2><p>Only one special person knows the answer.</p><label for="password-input">ENTER THE SECRET PASSWORD</label><input id="password-input" type="password" autocomplete="off" placeholder="Secret password"><button id="unlock-btn" type="button">Unlock 💙</button><p id="password-error" role="alert"></p></div></section>
  <main id="app" hidden></main><audio id="bg-music" src="assets/music/1000x - Ghea Indrawari _ Lirik Lagu.mp3" loop preload="auto"></audio><button id="music-toggle" type="button" aria-label="Play or pause music">♫</button>
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer"><div class="lightbox-card"><button id="lightbox-close" aria-label="Close photo">×</button><img id="lightbox-image" alt=""><p id="lightbox-caption"></p></div></div>
  <script>
    /* ==================== EDIT BAGIAN INI SAJA ==================== */
    const KONTEN={
      password:'28092025', // Ganti angka/teks ini dengan password kamu.
      judul:'Happy Girlfriend<br><em>Day 💙</em>',subjudul:'Welcome to our little memory garden.',
      surat:`My love,\n\nHai manis💙\n\nCie yang sekarang udah jadi mantan, kira kira mantan terindah bukan ya?? hmm jadi bingung hehe\n\nWith all my love, always.ASZEKKK💙`,
      foto:[
        ['assets/images/bioskop.jpg','Bioskop day','Kamu inget moment ini?'],
        ['assets/images/nyender.jpg','First Date','Haha lucunya momen kamu nyender aku.'],
        ['assets/images/dicurug.jpg','Curug Genting','Momen sebelum kita jadian. banyak part lucunya.'],
        ['assets/images/temansemeja.jpg','A Little Moment','Momen kecil yang tetap jadi bagian dari cerita kita.'],
        ['assets/images/bunga1.jpg','Today','Makasi ya udah pernah jadi bagian dari ceritaku.'],
        ['assets/images/ultah.jpg','Birthday','Kamu inget dimana kamu pengen diurut eh ke surprise.'],
        ['assets/images/bunga2.jpg','Today','Aku yakin kamu kuat ngejalani hidup ini, semangat ya wanita hebatku💙.'],
        ['assets/images/bunga3.jpeg','Today','Maaf aku gagal memenuhi semua ekspetasi kamu dan gagal mencintai kamu.'],
        ['assets/videos/nangis.mp4','Moment','Saksi dimana kita nangis bareng sekaligus date terakhir kita pas pacaran.']
      ],
      kenangan:[['First Chat','Masi ingat bgt momen kamu dm aku yang lagi keren bgt itu.'],['First Date','Haha lucunya momen kamu nyender aku.'],['Our Favorite Memory','Part paling fav dari perjalanan kita itu pas kita ke curug genting momen dimana kita jadian. Kamu inget ga?'],['Today','Tetep semangat ya walau udah punya dunia masing masing aku tetep berharap kamu selalu jadi wanita kuat yang ceria menghadapi hidup ini.']],
      alasan:['Aku suka cara kamu meluk aku.','Aku suka dicium kamu.','Aku suka liat keplengeran kamu.','Aku suka cara kamu ngadepin sifat kekanak kanakanku.','Aku benci diriku yang gagal MENCINTAIMU.'],
      penutup:'Thank you…<br>for becoming<br><em>the most beautiful chapter</em><br>of my life.'
    };
    /* ================= JANGAN EDIT DI BAWAH INI ================= */
    const $=s=>document.querySelector(s),app=$('#app'),music=$('#bg-music');let reasonIndex=0,musicStarted=false;
    app.innerHTML=`<section class="page"><div class="field"></div><p class="eyebrow">For you, always</p><h1>${KONTEN.judul}</h1><p class="desc">${KONTEN.subjudul}</p><button class="btn" id="enter-garden">Enter the garden ↓</button></section><section class="page" id="surat"><article class="letter"><p class="eyebrow">A note kept between the flowers</p><p>${KONTEN.surat}</p></article></section><section class="page"><p class="eyebrow">Little pieces of us</p><h2>Our photo<br><em>garden.</em></h2><div class="gallery">${KONTEN.foto.map((f,n)=>`<figure class="photo" style="--r:${[-3,2,-1,3,-2][n]}deg" data-src="${f[0]}" data-title="${f[1]}" data-caption="${f[2]}">${f[0].endsWith('.mp4')
  ? `<video controls playsinline preload="metadata">
       <source src="${f[0]}" type="video/mp4">
     </video>`
  : `<img src="${f[0]}" alt="${f[1]}" loading="lazy">`
}<figcaption>${f[1]}<small>tap to remember</small></figcaption></figure>`).join('')}</div></section><section class="page"><p class="eyebrow">Follow the moonlit path</p><h2>Our little<br><em>memories.</em></h2><div class="memories">${KONTEN.kenangan.map((x,n)=>`<article class="memory"><i>✿</i><div><small>MEMORY 0${n+1}</small><h3>${x[0]}</h3><p>${x[1]}</p></div></article>`).join('')}</div></section><section class="page"><p class="eyebrow">Tap the flower, gently</p><h2>Reasons I<br><em>love you.</em></h2><button class="reason" id="reason">${KONTEN.alasan[0]}</button></section><section class="page final"><div class="field"></div><p class="eyebrow">From the bottom of my heart</p><h2>${KONTEN.penutup}</h2><button class="btn" id="love">I Love You ✿</button></section>`;
    function fadeMusic(){if(musicStarted)return;musicStarted=true;music.volume=0;music.play().catch(()=>{});let v=0;const fade=setInterval(()=>{v=Math.min(0.55,v+.025);music.volume=v;if(v>=.55)clearInterval(fade)},100);$('#music-toggle').classList.add('playing')}
    function unlock(){const input=$('#password-input'),error=$('#password-error');if(input.value===KONTEN.password){fadeMusic();burst(innerWidth/2,innerHeight/2,35);$('#password-screen').style.opacity='0';$('#password-screen').style.visibility='hidden';app.hidden=false;setTimeout(()=>$('#enter-garden').focus(),700)}else{error.textContent='Oops… password-nya belum tepat 💙';input.classList.remove('shake');void input.offsetWidth;input.classList.add('shake');input.select()}}
    const pages=[...document.querySelectorAll('#app .page')];let currentPage=0;function showPage(index){currentPage=Math.max(0,Math.min(index,pages.length-1));pages.forEach((page,n)=>page.classList.toggle('active',n===currentPage));window.scrollTo({top:0,behavior:'smooth'})}pages.forEach((page,n)=>{const nav=document.createElement('div');nav.className='page-nav';if(n>0){const previous=document.createElement('button');previous.className='nav-btn';previous.textContent='← Kembali';previous.onclick=()=>showPage(n-1);nav.append(previous)}if(n<pages.length-1){const next=document.createElement('button');next.className='nav-btn next';next.textContent='Lanjut →';next.onclick=()=>showPage(n+1);nav.append(next)}page.append(nav)});showPage(0);
    $('#unlock-btn').onclick=unlock;$('#password-input').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});$('#enter-garden').onclick=()=>showPage(1);$('#reason').onclick=e=>{reasonIndex=(reasonIndex+1)%KONTEN.alasan.length;e.target.textContent=KONTEN.alasan[reasonIndex];burst(e.clientX,e.clientY,15)};$('#love').onclick=e=>burst(e.clientX,e.clientY,120);$('#music-toggle').onclick=()=>{if(music.paused){music.play();$('#music-toggle').classList.add('playing')}else{music.pause();$('#music-toggle').classList.remove('playing')}};
    document.querySelectorAll('.photo').forEach(card=>card.onclick=()=>{const img=$('#lightbox-image');img.src=card.dataset.src;img.alt=card.dataset.title;$('#lightbox-caption').textContent=card.dataset.title+' — '+card.dataset.caption;$('#lightbox').style.display='grid';burst(innerWidth/2,innerHeight/2,16)});$('#lightbox-close').onclick=()=>$('#lightbox').style.display='none';$('#lightbox').onclick=e=>{if(e.target.id==='lightbox')e.currentTarget.style.display='none'};
    function burst(x,y,n){for(let a=0;a<n;a++){const p=document.createElement('i');p.className='petal';p.textContent=a%3?'❋':'✿';p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--x',(Math.random()*400-200)+'px');document.body.append(p);setTimeout(()=>p.remove(),3000)}}
    const c=$('#stars'),ctx=c.getContext('2d');function sky(){c.width=innerWidth;c.height=innerHeight;ctx.clearRect(0,0,c.width,c.height);for(let n=0;n<110;n++){ctx.fillStyle='#c9f2ff';ctx.globalAlpha=.15+Math.random()*.85;ctx.fillRect(Math.random()*c.width,Math.random()*c.height*.75,1,1)}ctx.globalAlpha=1}sky();addEventListener('resize',sky);
  </script>
</body>
</html>
